<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIBERone Card Generator</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <!-- Style -->
    <link rel="stylesheet" href="style.css">
    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Editor -->
        <aside class="editor-sidebar">
            <div class="editor-header">
                <div class="logo-text">KIBERone</div>
                <p style="font-size: 0.7rem; color: #666; margin-top: 0.2rem;">CARD GENERATOR v1.0</p>
            </div>

            <div class="input-group">
                <label>Курс / Модуль</label>
                <input type="text" id="input-course" placeholder="Напр: C# Программирование">
            </div>

            <div class="input-group">
                <label>Номер урока / Тема</label>
                <input type="text" id="input-theme" placeholder="Напр: Урок 4: Классы и объекты">
            </div>

            <div class="input-group">
                <label>Что делали</label>
                <textarea id="input-did" placeholder="Опишите процесс..."></textarea>
            </div>

            <div class="input-group">
                <label>Чему учит</label>
                <textarea id="input-learn" placeholder="Опишите навыки..."></textarea>
            </div>

            <div class="input-group">
                <label>Чем полезно в будущем</label>
                <textarea id="input-future" placeholder="Опишите перспективу..."></textarea>
            </div>

            <button class="btn-export" id="btn-export">
                <i data-lucide="download"></i>
                СКАЧАТЬ В JPG
            </button>
        </aside>

        <!-- Preview Area -->
        <main class="preview-area">
            <div id="card-to-export">
                <div class="card-bg-decoration">
                    <div class="grid-overlay"></div>
                    <div class="circle-grad blue-grad"></div>
                    <div class="circle-grad pink-grad"></div>
                </div>

                <div class="card-content">
                    <div class="card-header">
                        <div class="lesson-badge" id="view-course">КУРС</div>
                        <div style="color: grey;"><i data-lucide="cpu" size="24"></i></div>
                    </div>

                    <h1 class="card-title" id="view-theme">Название урока</h1>

                    <div class="section">
                        <span class="section-label">ЧТО ДЕЛАЛИ</span>
                        <div class="section-content" id="view-did"></div>
                    </div>

                    <div class="section magenta">
                        <span class="section-label">ЧЕМУ УЧИТ</span>
                        <div class="section-content" id="view-learn"></div>
                    </div>

                    <div class="section purple">
                        <span class="section-label">ПОЛЬЗА В БУДУЩЕМ</span>
                        <div class="section-content" id="view-future"></div>
                    </div>

                    <div class="card-footer">
                        <div class="footer-logo">KIBER<span>one</span></div>
                        <div class="footer-info">
                            Первая международная кибершкола<br>
                            будущего для детей
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Script -->
    <script src="app.js"></script>
</body>
</html>
